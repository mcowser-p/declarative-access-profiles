---
# matrix.yml — the app × distro capture matrix. Single source of truth for
# scripts/capture-matrix.sh, tools/check_profiles.py, and the docs coverage
# table.
#
# Cell fields:
#   package  (required) distro package to install
#   app      value for `treadmark footprint --app` (default: the row slug)
#   service  unit name asserted in the footprint and targeted by verify
#   extra    extra packages installed alongside (list)
#   repos    extra package repos enabled before install (list). Values:
#            epel — EL-family only, installs epel-release first;
#            mssql-2025 — packages.microsoft.com for SQL Server 2025, config
#            URL keyed by family and major version (RHEL 9/10, Ubuntu 24.04)
#   na       reason this cell is not applicable (mutually exclusive with
#            package) — N/A is always a recorded decision, never silence

distros:
  almalinux-9: {image: "almalinux:9", family: rhel}
  almalinux-10: {image: "almalinux:10", family: rhel}
  ubuntu-24.04: {image: "ubuntu:24.04", family: debian}
  ubuntu-26.04: {image: "ubuntu:26.04", family: debian}
  amazonlinux-2023: {image: "amazonlinux:2023", family: rhel}

apps:
  nginx:
    almalinux-9: {package: nginx, service: nginx.service}
    almalinux-10: {package: nginx, service: nginx.service}
    ubuntu-24.04: {package: nginx, service: nginx.service}
    ubuntu-26.04: {package: nginx, service: nginx.service}
    amazonlinux-2023: {package: nginx, service: nginx.service}
  apache:
    almalinux-9: {package: httpd, app: httpd, service: httpd.service}
    almalinux-10: {package: httpd, app: httpd, service: httpd.service}
    ubuntu-24.04: {package: apache2, app: apache2, service: apache2.service}
    ubuntu-26.04: {package: apache2, app: apache2, service: apache2.service}
    amazonlinux-2023: {package: httpd, app: httpd, service: httpd.service}
  haproxy:
    almalinux-9: {package: haproxy, service: haproxy.service}
    almalinux-10: {package: haproxy, service: haproxy.service}
    ubuntu-24.04: {package: haproxy, service: haproxy.service}
    ubuntu-26.04: {package: haproxy, service: haproxy.service}
    amazonlinux-2023: {package: haproxy, service: haproxy.service}
  tomcat:
    almalinux-9: {package: tomcat, service: tomcat.service}
    almalinux-10: {package: tomcat, service: tomcat.service}
    ubuntu-24.04: {package: tomcat10, app: tomcat10, service: tomcat10.service}
    # 26.04 ships tomcat10 and tomcat11; newest wins (recon 2026-08-23)
    ubuntu-26.04: {package: tomcat11, app: tomcat11, service: tomcat11.service}
    amazonlinux-2023: {na: "tomcat not packaged in AL2023 core repos and no EPEL support"}
  php-fpm:
    almalinux-9: {package: php-fpm, service: php-fpm.service}
    almalinux-10: {package: php-fpm, service: php-fpm.service}
    ubuntu-24.04: {package: php8.3-fpm, app: php8.3-fpm, service: php8.3-fpm.service}
    ubuntu-26.04: {package: php8.5-fpm, app: php8.5-fpm, service: php8.5-fpm.service}
    # AL2023 streams are versioned (8.2/8.3/8.4); newest wins, unit stays
    # unversioned (recon 2026-08-23)
    amazonlinux-2023: {package: php8.4-fpm, service: php-fpm.service}
  postgresql:
    almalinux-9: {package: postgresql-server, app: postgresql, service: postgresql.service}
    almalinux-10: {package: postgresql-server, app: postgresql, service: postgresql.service}
    # Ubuntu meta-package pulls postgresql-16; config splits to
    # /etc/postgresql/16/main (cluster model) — the review must reflect it.
    ubuntu-24.04: {package: postgresql, service: postgresql.service}
    ubuntu-26.04: {package: postgresql, service: postgresql.service}
    # AL2023 offers 15/16/17 server streams; newest wins (recon 2026-08-23)
    amazonlinux-2023: {package: postgresql17-server, app: postgresql, service: postgresql.service}
  mariadb:
    almalinux-9: {package: mariadb-server, app: mariadb, service: mariadb.service}
    almalinux-10: {package: mariadb-server, app: mariadb, service: mariadb.service}
    ubuntu-24.04: {package: mariadb-server, app: mariadb, service: mariadb.service}
    ubuntu-26.04: {package: mariadb-server, app: mariadb, service: mariadb.service}
    # AL2023 offers 10.5 and 10.11 streams; newest wins (recon 2026-08-23)
    amazonlinux-2023: {package: mariadb1011-server, app: mariadb, service: mariadb.service}
  mysql:
    # conflicts: packages removed BEFORE the re-baseline (mysql-server and
    # mariadb-server cannot coexist on EL9; mariadb is captured earlier in
    # the same container).
    almalinux-9: {package: mysql-server, app: mysql, service: mysqld.service,
                  conflicts: [mariadb-server]}
    almalinux-10: {na: "mysql-server dropped from EL10 — mariadb is the packaged option"}
    # Wave-2 flip: the wave-1 cut is over — capture the EL9-vs-Ubuntu mysql
    # comparison on the KVM substrate.
    ubuntu-24.04: {package: mysql-server, app: mysql, service: mysql.service,
                   conflicts: [mariadb-server]}
    ubuntu-26.04: {package: mysql-server, app: mysql, service: mysql.service,
                   conflicts: [mariadb-server]}
    amazonlinux-2023: {na: "mysql not packaged in AL2023 — community RPM only, out of scope"}
  mssql:
    # Microsoft SQL Server 2025 on Linux: ONE package for every edition — the
    # edition (Express, Evaluation, Standard, ...) is chosen at `mssql-conf
    # setup`, which capture never runs, so the footprint is edition-neutral.
    # Microsoft's support matrix is RHEL 9/10 + Ubuntu 24.04; alma is
    # RHEL-compatible and is what the fleet actually runs.
    almalinux-9: {package: mssql-server, service: mssql-server.service, repos: [mssql-2025]}
    almalinux-10: {package: mssql-server, service: mssql-server.service, repos: [mssql-2025]}
    ubuntu-24.04: {package: mssql-server, service: mssql-server.service, repos: [mssql-2025]}
    ubuntu-26.04: {na: "not in SQL Server 2025's support matrix — Ubuntu support caps at 24.04"}
    amazonlinux-2023: {na: "not a supported SQL Server platform (RHEL and Ubuntu only), not packaged"}
  redis:
    # Distro-split row: EL10 replaced redis with valkey (license change).
    # Footprint files keep the row slug (footprint-redis.json); the model's
    # app name stays honest (valkey).
    almalinux-9: {package: redis, service: redis.service}
    almalinux-10: {package: valkey, app: valkey, service: valkey.service}
    ubuntu-24.04: {package: redis-server, app: redis, service: redis-server.service}
    # 26.04 ships both redis-server and valkey; valkey per the EL10
    # precedent (recon 2026-08-23). The canonical packaged unit is
    # valkey-server.service — valkey.service is only its Install.Alias
    # (footprint evidence; the Debian redis-server pattern).
    ubuntu-26.04: {package: valkey, app: valkey, service: valkey-server.service}
    # AL2023 ships both redis6 and valkey; valkey for row consistency
    # (recon 2026-08-23)
    amazonlinux-2023: {package: valkey, app: valkey, service: valkey.service}
  memcached:
    almalinux-9: {package: memcached, service: memcached.service}
    almalinux-10: {package: memcached, service: memcached.service}
    ubuntu-24.04: {package: memcached, service: memcached.service}
    ubuntu-26.04: {package: memcached, service: memcached.service}
    amazonlinux-2023: {package: memcached, service: memcached.service}
  caddy:
    # EL ships caddy via EPEL only (repos: [epel]); Ubuntu has it in universe.
    almalinux-9: {package: caddy, service: caddy.service, repos: [epel]}
    almalinux-10: {package: caddy, service: caddy.service, repos: [epel]}
    ubuntu-24.04: {package: caddy, service: caddy.service}
    ubuntu-26.04: {package: caddy, service: caddy.service}
    amazonlinux-2023: {na: "no EPEL support on AL2023 and caddy not in core repos"}
