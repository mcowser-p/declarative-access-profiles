---
# declarative-access-profiles :: tomcat (tomcat11) on ubuntu-26.04
#
# PROVENANCE
#   footprint : footprints/ubuntu-26.04/footprint-tomcat.json
#               (schema 1.0, install_time; captured 2026-08-23 on the
#               Ubuntu 26.04 KVM golden image; treadmark 0.11.0. application
#               slug 'tomcat11' — 26.04 ships tomcat10 AND tomcat11; the matrix
#               takes the newest (matrix.yml recon 2026-08-23). apt auto-started
#               tomcat11 at install, so the footprint includes first-start side
#               effects and the multi-user.target.wants enablement symlink.)
#   raw       : ./ubuntu-26.04-raw.yml  (diff against this file = the review)
#   docs      : ../../docs/apps/tomcat/ops.md  (review reasoning, §2)
#
# ACCESS MODEL: app-server — pam_group into the service group 'tomcat' is the
# PRIMARY grant. Same shape as the ubuntu-24.04 (tomcat10) review, one major
# version up: the Debian package ships the deploy/context dirs group-writable
# to 'tomcat' (footprint group_access: /var/lib/tomcat11/webapps 0775
# tomcat:tomcat, /etc/tomcat11/Catalina 0775 root:tomcat), so membership =
# webapp deploy + context config with ZERO deviation from vendor permissions.
# Config write ACL on /etc/tomcat11 (files are group-READ only) + log read ACL
# on /var/log/tomcat11. Read-only-units profile. The Debian unit grants ambient
# CAP_NET_BIND_SERVICE (privileged-port bind without root) — vendor-owned and
# NOT in this profile; see ops §11. Real tomcat10->11 differences in this
# capture: no Security Manager artifacts (no /etc/tomcat11/policy.d, no
# /var/lib/tomcat11/policy, no ExecStartPre= policy script in the unit) and an
# OpenJDK 25 dependency closure (/etc/java-25-openjdk + fontconfig).
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/tomcat/ubuntu-26.04-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-23   VERIFIED: 2026-08-23 (KVM ubuntu2604-20260823, AppArmor, real PAM, no CIS hardening)

# REVIEW-CHANGE: profile_name 'tomcat11' -> 'tomcat' — normalized to the library
# app slug (check_profiles requires profile_name == the app dir). Cosmetic: it
# names the rendered sudoers file / group.conf label, not any unit or path (the
# service below stays 'tomcat11').
declarative_access_profile_name: 'tomcat'
declarative_access_sudo: true
declarative_access_services:
  - 'tomcat11'

declarative_access_pam_group: true
declarative_access_local_groups:
  # REVIEW-KEEP: app-server class — the exporter chose pam_group into 'tomcat'
  # (correct; group_access shows the 'tomcat' group writable on
  # /var/lib/tomcat11/webapps and /etc/tomcat11/Catalina). The Debian package
  # ships those deploy dirs group-writable, so membership = webapp deploy +
  # context config with zero drift. Note: unlike Debian nginx/apache (shared
  # 'www-data'), 'tomcat' is Tomcat-specific — no cross-service exposure.
  - 'tomcat'

# REVIEW-DROP: declarative_access_files_modify [/etc/systemd/system/multi-user
# .target.wants/tomcat11.service enablement symlink + /lib + /usr/lib
# .../tomcat11.service] — vendor unit + the enablement symlink apt created on
# auto-start; unit-file write is root-equivalent. Read-only-units profile. These
# units also carry ambient CAP_NET_BIND_SERVICE (ops §11) — a second reason the
# team must not be able to rewrite them.

declarative_access_folders_modify:
  - '/etc/tomcat11'
  # REVIEW-KEEP: config write ACL. /etc/tomcat11 is 0755 root:root and its files
  # (server.xml, tomcat-users.xml, catalina.properties, ...) are 0640 root:tomcat
  # — group READ only — so pam_group does not confer config write. The ACL lets
  # the team edit server.xml and place the TLS PKCS12 keystore. Config is ACL'd
  # to the TEAM, never chgrp'd to the service account. tomcat11 ships no
  # policy.d/ in this tree (Security Manager removed) — one subtree fewer than
  # the tomcat10 review.
  # REVIEW-DROP: '/etc/.java', '/etc/java-25-openjdk' — JVM / openjdk config from
  # the java dependency closure (OpenJDK 25 on 26.04); not Tomcat's.
  # REVIEW-DROP: '/etc/fonts' — fontconfig, pulled in by the OpenJDK 25
  # dependency closure (absent from the 24.04 capture); platform concern, not
  # Tomcat's.
  # REVIEW-DROP: '/var/lib/ca-certificates-java' — system Java CA trust store
  # (ca-certificates-java dependency); trust management is a platform concern.
  # REVIEW-DROP: '/var/cache/tomcat11' — systemd CacheDirectory (service runtime,
  # CacheDirectoryMode 0750); the service writes it, the team does not.
  # REVIEW-DROP: '/var/lib/tomcat11' — CATALINA_BASE; the team writes only
  # webapps/, already group-writable via pam_group above. Broad recursive ACL
  # removed (it would also expose /var/lib/tomcat11/lib, which is the service's;
  # unlike tomcat10 there is no policy/ dir here — Security Manager removed).

declarative_access_folders_read:
  # REVIEW-ADD: /var/log excluded from footprints by default. The unit confirms
  # the dir (RequiresMountsFor=/var/log/tomcat11 and
  # ReadWritePaths=/var/log/tomcat11/). Debian rotates catalina.out via
  # /etc/logrotate.d/tomcat11 (cron.daily); juli self-rotates the per-day *.log
  # files. Default ACL keeps both readable (ops §10).
  - '/var/log/tomcat11'

# No declarative_access_ownership: the raw had none and none is wanted — the
# deploy tree is ALREADY the desired state (/var/lib/tomcat11/webapps 0775
# tomcat:tomcat is vendor-shipped group-writable). Zero drift means nothing to
# enforce or accept-list here (same property as the tomcat10 review; contrast
# the EL captures, which keep the vendor ownership entries).
