---
# declarative-access-profiles :: memcached on almalinux-9
#
# PROVENANCE
#   footprint : footprints/almalinux-9/footprint-memcached.json
#               (schema 1.0, footprint_type install_time, captured 2026-08-09
#               on an AlmaLinux 9 EC2 AMI, SELinux enforcing; treadmark 0.10.0
#               feature branch)
#   raw       : ./almalinux-9-raw.yml   (diff against this file = the review)
#   docs      : ../../docs/apps/memcached/ops.md  (review reasoning, §2)
#
# ACCESS MODEL: cache — the most minimal profile in the library. Scoped service
# control + a single config-file write ACL (/etc/sysconfig/memcached). NO
# pam_group (the 'memcached' group owns nothing on disk — membership grants
# nothing), NO log dir (memcached logs to the journal only — no /var/log grant),
# NO data dir (memcached is in-memory; nothing is persisted). Read-only-units
# profile: no unit-file write anywhere.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/memcached/almalinux-9-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-09   VERIFIED: 2026-08-26 (KVM alma9-20260823, SELinux enforcing, real PAM, CIS L1)

declarative_access_profile_name: 'memcached'
declarative_access_sudo: true
declarative_access_services:
  - 'memcached'

# REVIEW-DROP: declarative_access_files_modify [/lib + /usr/lib .../memcached.service]
# — vendor unit files (the /lib path is the usr-merge symlink of the same unit);
# a write ACL on a unit file is root-equivalent for that unit (edit ExecStart/-u
# then use the granted daemon-reload + restart). Read-only-units profile.

# REVIEW-DROP: declarative_access_folders_modify
# [/var/lib/selinux/targeted/active/modules/200/memcached] — the compiled SELinux
# policy module shipped by the memcached-selinux subpackage; a system-owned
# SELinux store, not team space. The team never edits a compiled policy module by
# hand (that is semodule/ops work).

declarative_access_files_modify:
  # REVIEW-ADD: cache class — config write ACL on the single tuning file
  # (root:root; PORT / USER / CACHESIZE / MAXCONN / OPTIONS, read as the unit's
  # EnvironmentFile). The raw omitted it: the file is root:root with no
  # group_access, so the exporter routed no grant. files_modify is a file-scoped
  # rw ACL (no default ACL — this is one file, not a directory). The 'memcached'
  # service account is NOT granted config write.
  - '/etc/sysconfig/memcached'

# NO declarative_access_folders_read: memcached logs to stderr, captured by the
# systemd journal only; the install creates no /var/log/memcached. Log reads are
# the granted `journalctl -u memcached` spellings (sudoers), not a file ACL. The
# generic REVIEW-ADD '/var/log/<app>' rule is deliberately NOT applied — there is
# no log directory to grant.

# NO declarative_access_pam_group / _local_groups: cache class. Unlike redis
# (whose group owns the data dir), the install-created 'memcached' group owns
# nothing on disk — config is root:root, and there is no data dir — so pam_group
# membership would grant no additional access. The option remains available at
# apply time (-e enable_pam_group=true
# -e '{"declarative_access_local_groups":["memcached"]}') but buys nothing here.

# NO declarative_access_ownership: the install creates no memcached-owned
# directories (an account + group only; config is root:root, no data/log dir), so
# there is no install-time owner/mode state to pin.
