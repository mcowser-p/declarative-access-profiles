---
# declarative-access-profiles :: apache (httpd) on amazonlinux-2023
#
# PROVENANCE
#   footprint : footprints/amazonlinux-2023/footprint-apache.json
#               (schema 1.0, install_time; captured 2026-08-23 on the
#               holy-qcow AL2023 KVM golden image; treadmark 0.11.0.
#               application slug 'httpd'.)
#   raw       : ./amazonlinux-2023-raw.yml  (diff against this file = the review)
#   docs      : ../../docs/apps/apache/ops.md  (review reasoning, §2)
#
# Reviewed result is IDENTICAL to almalinux-9/10 as of this capture: AL2023's
# httpd is the same EL shape (same 8 vendor units incl. httpd.socket, same
# 'apache' uid/gid 48 account, same /etc/httpd tree, same /var/lib/httpd
# apache:apache 0700), and the raw matches almalinux-10's byte for byte apart
# from the header — including the empty /etc/systemd/system/httpd.service.d
# drop-in dir, which the review drops anyway. AL2023's suexec carries the same
# file-capability xattr as alma9/10 (high risk, accepted — ops §11). Unlike
# EL10, AL2023's vendor units ship no ProtectSystem/ProtectHome hardening
# (changes nothing in a read-only-units profile).
#
# ACCESS MODEL: webserver — pam_group into 'apache' + setgid content dir +
# config write ACL on /etc/httpd + log read ACL on /var/log/httpd.
# Read-only-units profile.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/apache/amazonlinux-2023-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-23   VERIFIED: 2026-08-23 (KVM al2023-20260823, SELinux permissive, real PAM, CIS L1)

# REVIEW-CHANGE: profile_name 'httpd' -> 'apache' — normalized to the library
# app slug (check_profiles requires profile_name == the app dir).
declarative_access_profile_name: 'apache'
declarative_access_sudo: true
declarative_access_services:
  - 'httpd'
  # REVIEW-DROP: 'htcacheclean' — mod_cache_disk cache cleaner (User=apache),
  # off by default; not the web server. Add back only if disk caching is
  # enabled.

# REVIEW-DROP: declarative_access_files_modify [8 entries: httpd.service,
# httpd@.service, httpd.socket, htcacheclean.service under /lib + /usr/lib] —
# vendor unit files; unit-file write is root-equivalent. Read-only-units.

declarative_access_pam_group: true
declarative_access_local_groups:
  # REVIEW-ADD: webserver class — team into the install-created 'apache' group.
  - 'apache'

declarative_access_folders_modify:
  - '/etc/httpd'
  # REVIEW-DROP: '/etc/systemd/system/httpd.service.d' — unit drop-in dir
  # (shipped empty on AL2023, as on EL10); root-equivalent with the granted
  # daemon-reload + restart.
  # REVIEW-DROP: '/var/lib/httpd' — service runtime state, not team space;
  # kept via the ownership entry below.

declarative_access_folders_read:
  # REVIEW-ADD: /var/log excluded from footprints by default.
  - '/var/log/httpd'

declarative_access_ownership:
  - {path: '/var/lib/httpd', owner: 'apache', group: 'apache', mode: '0700'}
  # REVIEW-ADD: setgid content dir (see almalinux-9 header) — not in the
  # footprint; accept-list for rpm -V.
  - {path: '/var/www/html', owner: 'root', group: 'apache', mode: '2775'}
