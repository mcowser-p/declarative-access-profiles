---
# declarative-access-profiles :: mysql on almalinux-9
#
# PROVENANCE
#   footprint : footprints/almalinux-9/footprint-mysql.json
#               (schema 1.0, captured 2026-08-09 on an AlmaLinux 9 EC2 AMI,
#               SELinux enforcing; cairn 0.10.0 feature branch. dnf does not
#               auto-start on install, so mysqld never ran: /var/lib/mysql is
#               present but empty — the initial --initialize / mysql-prepare-db-dir
#               has not run, so no tables, no auto-generated TLS pair yet.)
#   raw       : ./almalinux-9-raw.yml   (diff against this file = the review)
#   docs      : ../../docs/apps/mysql/ops.md  (review reasoning, §2)
#
# ACCESS MODEL: database — config-scoped. Config write ACL on the drop-in dir
# (/etc/my.cnf.d) + log read ACL. NO pam_group into the 'mysql' group (that
# group owns the raw data files, so membership = filesystem access that bypasses
# every SQL GRANT). The data dir (/var/lib/mysql) and its siblings
# (/var/lib/mysql-files, /var/lib/mysql-keyring) are NEVER granted.
# Read-only-units profile: no unit-file write anywhere.
#
# alma10 + ubuntu-24.04 are N/A for mysql (matrix.yml): EL10 dropped
# mysql-server (mariadb is the packaged option) and Ubuntu is a deliberate
# wave-1 scope cut (mariadb covers the Ubuntu MySQL-compatible story; the
# package exists). This is the only reviewed mysql profile.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/mysql/almalinux-9-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-09   VERIFIED: 2026-08-09 (EC2 almalinux-9 ami-01dee4dd01d81901c, SELinux/authselect real)

declarative_access_profile_name: 'mysql'
declarative_access_sudo: true
declarative_access_services:
  - 'mysqld'

# REVIEW-DROP: declarative_access_files_modify [mysqld.service + mysqld@.service,
# each under /lib and /usr/lib — 4 paths] — vendor unit files; a write ACL on a
# unit file is root-equivalent for that unit (edit ExecStart, which runs
# /usr/libexec/mysqld, then the granted daemon-reload + restart). Read-only-units
# profile.

# NOTE (pam_group): there is no declarative_access_pam_group in the raw to DROP.
# Database class grants none, and the exporter emitted none here because the
# 'mysql' user/group already existed at capture (summary users_added = 0,
# groups_added = 0: the mysql account was created by the earlier mariadb capture
# in the same container, so mysql-server's sysusers.d/mysql.conf was a no-op).
# On a clean host the exporter WOULD emit pam_group + local_groups: ['mysql'],
# and this review would DROP it for the same database-class reason as
# mariadb/postgresql — the group owns the raw data files. The apply-time opt-in
# for a team that knowingly accepts data-dir exposure is documented in ops §3.

declarative_access_folders_modify:
  - '/etc/my.cnf.d'
  # REVIEW-DROP: '/var/lib/mysql' — the data directory (mysql:mysql 0755).
  # Database class NEVER grants it in any list; filesystem access to the raw
  # tables bypasses the DB's own GRANTs. Install-time state is kept visible via
  # the ownership entry below (an assertion, not a grant).
  # REVIEW-DROP: '/var/lib/mysql-files' — the secure_file_priv import/export dir
  # (mysql:mysql 0750); data-adjacent, holds bulk LOAD DATA / SELECT ... INTO
  # OUTFILE payloads. Never granted for a database.
  # REVIEW-DROP: '/var/lib/mysql-keyring' — the keyring dir (mysql:mysql 0700)
  # holding InnoDB tablespace-encryption master keys. Granting it hands the team
  # the at-rest encryption keys; never granted, more sensitive than the data dir.
  # REVIEW-DROP: '/var/lib/selinux/targeted/active/modules/200/mysql' — the
  # compiled SELinux policy module store (root:root 0700); landed with the policy
  # module, not team space and never hand-edited.

declarative_access_folders_read:
  # REVIEW-ADD: /var/log is excluded from footprints by default; file-log read is
  # still wanted (ACL + default ACL keeps rotated files readable). EL mysql-server
  # ships /etc/logrotate.d/mysqld and /usr/lib/tmpfiles.d/mysqld.conf, and the
  # default /etc/my.cnf.d/mysql-server.cnf points log-error at
  # /var/log/mysql/mysqld.log. Whether the server writes a file here or only to
  # journald depends on the log-error setting [needs-runtime-confirmation]; the
  # log dir is the grant unit either way.
  - '/var/log/mysql'

declarative_access_ownership:
  # REVIEW-ADD: assert the captured install-time state of the data + data-adjacent
  # dirs and make drift visible. NOT an access grant — no membership or ACL on
  # these paths is created; the entries only chown/chmod them back to the captured
  # state (state_dir evidence) on apply, re-tightening the 0700 keyring or 0750
  # secure_file_priv dir if drift ever loosens them. The raw omitted ownership
  # only because the mysql account pre-existed in this shared-container capture
  # (users_added/groups_added = 0); on a clean host the exporter would emit at
  # least the /var/lib/mysql entry.
  - {path: '/var/lib/mysql', owner: 'mysql', group: 'mysql', mode: '0755'}
  - {path: '/var/lib/mysql-files', owner: 'mysql', group: 'mysql', mode: '0750'}
  - {path: '/var/lib/mysql-keyring', owner: 'mysql', group: 'mysql', mode: '0700'}
