declarative_access_pam_group: true
declarative_access_local_groups:
  - 'mysql'
declarative_access_files_modify:
  - '/etc/systemd/system/multi-user.target.wants/mysql.service'
  - '/lib/systemd/system/mysql.service'
  - '/usr/lib/systemd/system/mysql.service'
declarative_access_folders_modify:
  - '/etc/init'
  - '/etc/logcheck/ignore.d.workstation'
  - '/etc/mysql'
  - '/var/lib/mecab'
  - '/var/lib/mysql'
  - '/var/lib/mysql-files'
  - '/var/lib/mysql-keyring'
  - '/var/lib/mysql-upgrade'
declarative_access_ownership:
  - { path: '/var/lib/mysql', owner: 'mysql', group: 'mysql', mode: '0700' }
  - { path: '/var/lib/mysql-files', owner: 'mysql', group: 'mysql', mode: '0700' }
  - { path: '/var/lib/mysql-keyring', owner: 'mysql', group: 'mysql', mode: '0700' }
