declarative_access_profile_name: 'postgresql'
declarative_access_sudo: true
declarative_access_services:
  - 'postgresql'
declarative_access_pam_group: true
declarative_access_local_groups:
  - 'postgres'
declarative_access_files_modify:
  - '/lib/systemd/system/postgresql.service'
  - '/lib/systemd/system/postgresql@.service'
  - '/usr/lib/systemd/system/postgresql.service'
  - '/usr/lib/systemd/system/postgresql@.service'
declarative_access_folders_modify:
  - '/etc/postgresql-setup'
  - '/var/lib/pgsql'
declarative_access_ownership:
  - { path: '/var/lib/pgsql', owner: 'postgres', group: 'postgres', mode: '0700' }
