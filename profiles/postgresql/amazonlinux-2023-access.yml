---
# declarative-access-profiles :: postgresql on amazonlinux-2023
#
# PROVENANCE
#   footprint : footprints/amazonlinux-2023/footprint-postgresql.json
#               (schema 1.0, captured 2026-08-23 on a holy-qcow Amazon Linux
#               2023 KVM golden image, host ansible@192.168.1.238; treadmark
#               0.11.0. Package: postgresql17-server — AL2023 ships versioned
#               server streams (15/16/17) and the matrix picks the newest —
#               but every on-disk path is UNVERSIONED and EL-identical:
#               postgresql.service, /usr/bin/postgres, /var/lib/pgsql. dnf
#               does not auto-start; postgresql-setup --initdb has not run,
#               so /var/lib/pgsql/{data,backups} ship as empty 0700 skeletons
#               and postgresql.conf / pg_hba.conf do not yet exist on disk.
#               SELinux is present but permissive by default on AL2023
#               (platform default, not in the capture) — see ops §1/§11.)
#   raw       : ./amazonlinux-2023-raw.yml  (diff against this file = the review)
#   docs      : ../../docs/apps/postgresql/ops.md  (review reasoning, §2)
#
# Reviewed result is IDENTICAL to almalinux-9/almalinux-10 as of this capture:
# the raw profiles are byte-identical across the three EL-family cells (same
# postgres uid/gid 26, same 4 vendor unit paths, same folders, same 0700 data
# root), and the review drops the same keys either way.
#
# ACCESS MODEL: database — config-scoped, NOT group-scoped. NO pam_group into
# the 'postgres' group (it owns the raw data); config lives inside the 0700
# data dir so config edits are SQL-side (ALTER SYSTEM) or ops. Never the data
# dir. Read-only-units profile. Log read = the journal via the service grant.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/postgresql/amazonlinux-2023-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-23   VERIFIED: 2026-08-26 (KVM al2023-20260823, SELinux permissive, real PAM, CIS L1)

declarative_access_profile_name: 'postgresql'
declarative_access_sudo: true
declarative_access_services:
  - 'postgresql'

# REVIEW-DROP: declarative_access_files_modify [postgresql.service +
# postgresql@.service, each under /lib and /usr/lib — 4 paths] — vendor unit
# files; unit-file write is root-equivalent. Read-only-units profile.

# REVIEW-DROP: declarative_access_pam_group + declarative_access_local_groups
# ['postgres'] — DATABASE class: the 'postgres' group owns the raw data under
# /var/lib/pgsql; membership bypasses every SQL GRANT. No pam_group by
# default. Apply-time opt-in documented in ops §3.

# REVIEW-DROP: declarative_access_folders_modify ['/etc/postgresql-setup',
# '/var/lib/pgsql'] — postgresql-setup upgrade tooling (root:root) is not team
# config; /var/lib/pgsql is the 0700 data dir (config lives inside it) and is
# NEVER grantable. EL config edits are SQL-side or ops — see ops §3.

declarative_access_ownership:
  # REVIEW-KEEP: enforces the install-time state of the 0700 data dir; an
  # ownership assertion, not an ACL — grants the team nothing. On AL2023
  # SELinux is permissive by default, so this DAC boundary is doing even more
  # of the work than on enforcing Alma hosts.
  - {path: '/var/lib/pgsql', owner: 'postgres', group: 'postgres', mode: '0700'}
