---
# declarative-access-profiles :: redis on almalinux-10  (package: valkey)
#
# PROVENANCE
#   footprint : footprints/almalinux-10/footprint-redis.json
#               (schema 1.0, captured 2026-08-09 on an AlmaLinux 10 EC2 AMI,
#               SELinux enforcing; treadmark 0.10.0 feature branch)
#   raw       : ./almalinux-10-raw.yml  (diff against this file = the review)
#   docs      : ../../docs/apps/redis/ops.md  (review reasoning, §2)
#
# EL10 dropped redis for valkey (redis's BSD->SSPL/RSAL relicense); the packaged
# app, unit, user, group and paths are all 'valkey'. This profile keeps the
# 'redis' row slug so it sits beside the EL9/Ubuntu redis profiles and passes
# the profile-name==app-dir contract check (tools/check_profiles.py).
#
# ACCESS MODEL: cache — scoped service control + config write ACL (/etc/valkey)
# + log read ACL. NO pam_group: the 'valkey' group owns the data dir
# /var/lib/valkey (0750), so membership would expose persisted data. Read-only-
# units profile. The data dir is never granted.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/redis/almalinux-10-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-09   VERIFIED: 2026-08-26 (KVM alma10-20260823, SELinux enforcing, real PAM, CIS L1)

# REVIEW-CHANGE: declarative_access_profile_name 'valkey' -> 'redis' — the raw
# names the packaged app (valkey); the reviewed profile uses the repo row slug
# 'redis' to satisfy the profile-name==app-dir contract check. Cosmetic only: it
# names the rendered sudoers file / group.conf label, not any unit or path.
declarative_access_profile_name: 'redis'
declarative_access_sudo: true
declarative_access_services:
  - 'valkey'
  # REVIEW-DROP: 'valkey-sentinel' — optional HA failover-monitor daemon,
  # disabled by default and unused on a single-node cache. Re-add if the
  # deployment actually runs Sentinel (sentinel.conf is under the /etc/valkey ACL).

# REVIEW-DROP: declarative_access_files_modify [/lib + /usr/lib .../valkey.service
# and valkey-sentinel.service] — vendor unit files; unit-file write is
# root-equivalent for that unit. Read-only-units profile.

# REVIEW-DROP: declarative_access_pam_group + declarative_access_local_groups
# ['valkey'] — cache class: the 'valkey' group owns /var/lib/valkey (0750), so
# pam_group would grant group read of persisted data beneath valkey AUTH/ACLs.
# Config write is granted via an ACL instead. The group option remains available
# at apply time (-e enable_pam_group=true) for teams that accept the tradeoff.

declarative_access_folders_modify:
  - '/etc/valkey'
  # REVIEW-DROP: '/var/lib/valkey' — the data dir; never granted (cache/DB
  # rule). Install-time state kept via ownership below.

declarative_access_folders_read:
  # REVIEW-ADD: /var/log excluded from footprints by default. NOTE: valkey logs
  # to the journal by default (logfile unset) — this dir is populated only if an
  # operator sets 'logfile'. [needs-runtime-confirmation]
  - '/var/log/valkey'

declarative_access_ownership:
  # REVIEW-KEEP: install-created state; config stays valkey:root 0750 (the team
  # writes via the ACL, the valkey service account is not in the config group).
  - {path: '/etc/valkey', owner: 'valkey', group: 'root', mode: '0750'}
  - {path: '/var/lib/valkey', owner: 'valkey', group: 'valkey', mode: '0750'}
