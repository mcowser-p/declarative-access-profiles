---
# declarative-access-profiles :: mariadb on almalinux-10
#
# PROVENANCE
#   footprint : footprints/almalinux-10/footprint-mariadb.json
#               (schema 1.0, captured 2026-08-09 on an AlmaLinux 10 EC2 AMI,
#               SELinux enforcing; cairn 0.10.0 feature branch)
#   raw       : ./almalinux-10-raw.yml  (diff against this file = the review)
#   docs      : ../../docs/apps/mariadb/ops.md  (review reasoning, §2)
#
# Reviewed result is IDENTICAL to almalinux-9 as of this capture. The raw
# differences are all dropped by the review: EL10 exports the mysql/mysqld
# service aliases and the mariadb/mariadb-extra .socket units separately, and
# a longer vendor unit-file list — none survive review.
#
# ACCESS MODEL: database — config-scoped. Config write ACL on the drop-in dir
# + log read ACL. NO pam_group (mysql group owns the raw data). Data dir
# (/var/lib/mysql) NEVER granted. Read-only-units profile.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/mariadb/almalinux-10-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-09   VERIFIED: 2026-08-09 (EC2 almalinux-10 ami-031f2f100ad9c9b8a, SELinux/authselect real)

declarative_access_profile_name: 'mariadb'
declarative_access_sudo: true
declarative_access_services:
  - 'mariadb'
  # REVIEW-DROP: 'mysql', 'mysqld' — Install.Alias names for mariadb.service (same
  # unit, same daemon). Grant the canonical name; the aliases resolve to it. See
  # dev.md §7.

# REVIEW-DROP: declarative_access_files_modify [/lib + /usr/lib .../mariadb.service,
# mariadb@.service, mariadb.socket, mariadb@.socket, mariadb-extra.socket,
# mariadb-extra@.socket, mysql.service, mysqld.service, and the galera bootstrap
# drop-in] — vendor unit files; a write ACL on any of them is root-equivalent for
# that unit. Read-only-units profile.

# REVIEW-DROP: declarative_access_pam_group + declarative_access_local_groups ['mysql']
# — database class: the mysql group owns the raw data files, so pam_group into it =
# filesystem access to the data dir, which bypasses every SQL GRANT. Config-scoped
# profile instead; the group option is an apply-time opt-in (ops.md §3).

declarative_access_folders_modify:
  - '/etc/my.cnf.d'
  # REVIEW-DROP: '/var/lib/mysql' — the data directory. Database class NEVER grants it.
  # REVIEW-DROP: '/var/lib/selinux/targeted/active/modules/200/mysql' — compiled
  # SELinux policy module store (root:root 0700); not team space.

declarative_access_folders_read:
  # REVIEW-ADD: /var/log excluded from footprints by default. EL mariadb-server ships
  # /etc/logrotate.d/mariadb → /var/log/mariadb/*.log; file vs journald destination
  # depends on the log-error setting [needs-runtime-confirmation].
  - '/var/log/mariadb'

declarative_access_ownership:
  # REVIEW-KEEP: asserts install-time state (mysql:mysql 0755); makes drift visible.
  # NOT an access grant — no membership or ACL on the data dir is created.
  - {path: '/var/lib/mysql', owner: 'mysql', group: 'mysql', mode: '0755'}
