---
# declarative-access-profiles :: mariadb on almalinux-9
#
# PROVENANCE
#   footprint : footprints/almalinux-9/footprint-mariadb.json
#               (schema 1.0, captured 2026-08-09 on an AlmaLinux 9 EC2 AMI,
#               SELinux enforcing; treadmark 0.10.0 feature branch)
#   raw       : ./almalinux-9-raw.yml   (diff against this file = the review)
#   docs      : ../../docs/apps/mariadb/ops.md  (review reasoning, §2)
#
# ACCESS MODEL: database — config-scoped. Config write ACL on the drop-in dir
# + log read ACL. NO pam_group (the mysql group owns the raw data files, so
# membership = data access, which bypasses every SQL GRANT). The data dir
# (/var/lib/mysql) is NEVER granted. Read-only-units profile: no unit-file
# write anywhere.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/mariadb/almalinux-9-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-09   VERIFIED: 2026-08-09 (EC2 almalinux-9 ami-01dee4dd01d81901c, SELinux/authselect real)

declarative_access_profile_name: 'mariadb'
declarative_access_sudo: true
declarative_access_services:
  - 'mariadb'

# REVIEW-DROP: declarative_access_files_modify [/lib + /usr/lib .../mariadb.service,
# mariadb@.service, mariadb@bootstrap.service.d/use_galera_new_cluster.conf] — vendor
# unit files; a write ACL on a unit file is root-equivalent for that unit (edit
# ExecStart + granted daemon-reload/restart). Read-only-units profile.

# REVIEW-DROP: declarative_access_pam_group + declarative_access_local_groups ['mysql']
# — database class: the mysql group owns the raw data files under /var/lib/mysql, so
# pam_group into it hands the team filesystem access to the data dir, which bypasses
# every GRANT the database enforces. DB administration is via the SQL client, not the
# filesystem. The group option stays available at apply time for teams that accept
# data-dir exposure knowingly — see ops.md §3.

declarative_access_folders_modify:
  - '/etc/my.cnf.d'
  # REVIEW-DROP: '/var/lib/mysql' — the data directory. Database class NEVER grants it
  # in any list; filesystem access to the raw tables bypasses the DB's own GRANTs.
  # Install-time state is kept visible via the ownership entry below (not a grant).
  # REVIEW-DROP: '/var/lib/selinux/targeted/active/modules/200/mysql' — the compiled
  # SELinux policy module store (root:root 0700); landed with the policy module, not
  # team space and never hand-edited.

declarative_access_folders_read:
  # REVIEW-ADD: /var/log is excluded from footprints by default; file-log read is still
  # wanted (ACL + default ACL keeps rotated files readable). EL mariadb-server ships
  # /etc/logrotate.d/mariadb rotating /var/log/mariadb/*.log; whether the server writes
  # here or only to journald depends on the log-error setting [needs-runtime-confirmation].
  - '/var/log/mariadb'

declarative_access_ownership:
  # REVIEW-KEEP: asserts the install-time state (mysql:mysql 0755) and makes drift
  # visible. This is NOT an access grant — the team gets no membership or ACL on the
  # data dir; the entry only chown/chmods it back to the captured state on apply.
  - {path: '/var/lib/mysql', owner: 'mysql', group: 'mysql', mode: '0755'}
