---
# declarative-access-profiles :: haproxy on almalinux-10
#
# PROVENANCE
#   footprint : footprints/almalinux-10/footprint-haproxy.json
#               (schema 1.0, captured 2026-08-09 on an AlmaLinux 10 EC2 AMI,
#               SELinux enforcing; treadmark 0.10.0 feature branch)
#   raw       : ./almalinux-10-raw.yml  (diff against this file = the review)
#   docs      : ../../docs/apps/haproxy/ops.md  (review reasoning, §2)
#
# Reviewed result is IDENTICAL to almalinux-9 as of this capture — the raw
# files are byte-identical (same vendor units, same /etc/haproxy + /var/lib/
# haproxy folders), and the review makes the same decisions on both.
#
# ACCESS MODEL: proxy — class defaults collapse (root-run daemon, empty
# 'haproxy' group, no content). Config write ACL on /etc/haproxy + service
# control, read-only units. NO pam_group, NO setgid content dir, NO /var/log
# ACL. Reduces to the cache/minimal shape. See ops §2/§3.
#
# APPLY
#   ansible-playbook -i inventory playbooks/5_apply_access_profile.yml \
#     -e @profiles/haproxy/almalinux-10-access.yml \
#     -e "group_name=<hostname>-app_restricted"
#   revoke: same command + --tags cleanup
#
# REVIEWED: 2026-08-09   VERIFIED: 2026-08-09 (EC2 almalinux-10 ami-031f2f100ad9c9b8a, SELinux/authselect real)

declarative_access_profile_name: 'haproxy'
declarative_access_sudo: true
declarative_access_services:
  - 'haproxy'

# REVIEW-DROP: declarative_access_files_modify [/lib, /usr/lib .../haproxy.service]
# — vendor unit files; unit-file write is root-equivalent, and haproxy.service
# has no User= so it runs as root. Read-only-units profile.

# REVIEW-DROP: proxy-class pam_group + local_groups ['haproxy'] — the 'haproxy'
# group has no members and owns nothing the team needs (group_access: [];
# /etc/haproxy and /var/lib/haproxy both root:root). pam_group would grant a
# no-op. See ops §3.

# REVIEW-DROP: proxy-class setgid content dir — pure proxy, no content root; the
# vendor error pages (/usr/share/haproxy/*.http) are root:root package files.

declarative_access_folders_modify:
  # REVIEW-KEEP: /etc/haproxy config write ACL (haproxy.cfg + conf.d drop-ins).
  # Retained despite the TLS caveat that a PEM bundle under /etc/haproxy/certs
  # would fall inside this write ACL — keep the bundle in /etc/pki/tls/private
  # (root:root 0600) by absolute path. See dev.md §4 + concepts/tls-ssl.md.
  - '/etc/haproxy'
  # REVIEW-DROP: '/var/lib/haproxy' — haproxy's chroot/state dir (root:root);
  # the service owns it, the team never writes here.

# REVIEW-DROP: /var/log/haproxy read grant (class default) — haproxy has no app
# log dir; it emits to syslog, and EL ships no rsyslog fragment, so only the
# journal carries output out of the box. The service grant's journalctl covers
# health; ops adds a folders_read entry only if a site routes haproxy to a
# dedicated log DIR. See ops §10.
