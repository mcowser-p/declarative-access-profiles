---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: pip install yamllint pyyaml mkdocs-material

      # Windows PowerShell 5.1 reads a BOM-less .ps1 as ANSI, so a UTF-8
      # em-dash arrives as mojibake. In a comment that is ugly; in a string
      # literal it breaks the PARSER and the script dies before its first
      # line runs. Cost one full VM cycle to diagnose. Keep them pure ASCII.
      - name: PowerShell scripts are pure ASCII
        run: |
          if LC_ALL=C grep -lP '[^\x00-\x7F]' scripts/*.ps1 2>/dev/null; then
            echo "::error::non-ASCII in the .ps1 files above; PS 5.1 decodes them as ANSI"
            LC_ALL=C grep -nP '[^\x00-\x7F]' scripts/*.ps1 | head -20
            exit 1
          fi
          echo "all .ps1 files are pure ASCII"

      - name: yamllint
        run: yamllint -c .yamllint matrix.yml profiles/ examples/ .github/

      - name: Profile contract check
        run: python tools/check_profiles.py

      - name: Coverage table is current
        run: python tools/gen_coverage.py --check

      - name: Build site (strict — broken links fail)
        run: mkdocs build --strict

  lint-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install ansible-lint ansible-core

      # the lockdown plays reference the collection's role by FQCN; install
      # it (and the examples' pinned public roles) so lint can resolve them
      - name: Install example requirements
        run: |
          for r in examples/*/requirements.yml; do
            ansible-galaxy install -r "$r" || exit 1
          done

      - name: ansible-lint examples
        run: ansible-lint examples/
