---
# Deploy nginx with geerlingguy.nginx configured least-priv-compatibly
# (docs/role-evals/nginx.md §6b). Runs in the SETUP WINDOW — executor in
# app-full, before capture — so the role's outputs land in the footprint
# like a manual install (§6a).
- name: Deploy nginx (least-privilege posture)
  hosts: "{{ target | default('nginx_hosts') }}"
  become: true
  roles:
    - role: geerlingguy.nginx
      vars:
        # packaged service account, never a login user; config stays
        # root-owned (role default — do not chown it to the service user)
        nginx_user: "{{ 'www-data' if ansible_os_family == 'Debian' else 'nginx' }}"
        nginx_remove_default_vhost: true
        # DISTRO package, not nginx.org's. The role defaults this to true on
        # EL and installs F5's build (nginx-1.30.4-1.el10.ngx, no
        # /var/lib/nginx) rather than the AppStream package this profile was
        # captured from -- lockdown then fails on a path that build never
        # creates. Ubuntu needs no equivalent: nginx_ppa_use already defaults
        # to false. See docs/role-evals/nginx.md §6b.
        nginx_yum_repo_enabled: false
        # content root = the packaged docroot the profile's setgid group
        # model covers; logs where the profile's /var/log/nginx read
        # grant expects them
        nginx_vhosts:
          - listen: "80"
            server_name: "{{ inventory_hostname }}"
            root: "{{ '/var/www/html' if ansible_os_family == 'Debian'
                      else '/usr/share/nginx/html' }}"
            access_log: /var/log/nginx/access.log
            error_log: /var/log/nginx/error.log
            extra_parameters: ""
