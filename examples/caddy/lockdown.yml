---
# Apply the reviewed caddy access profile — playbook-5 mechanics with the
# profile resolved from THIS checkout.
#
#   local:     ansible-playbook -i <inv> lockdown.yml -e distro_slug=ubuntu-24.04
#   AD-joined: ... -e group_name=<AD-group> -e ad_domain=<realm>
#   revoke: same command + --tags cleanup
- name: Lock down caddy admin surface
  hosts: "{{ target | default('caddy_hosts') }}"
  become: true
  vars:
    # almalinux-9 | almalinux-10 | ubuntu-24.04 | ubuntu-26.04  (al2023: N/A)
    distro_slug: ubuntu-24.04
    group_name: "{{ ansible_hostname }}-app_restricted"
    # group_name stays the knob (the collection README, playbook 5 and every
    # profile header document `-e group_name=...`), but it must be MAPPED here.
    # playbooks/5_apply_access_profile.yml does this mapping itself; calling the
    # role directly, as this example does, skips it, and the role then fails its
    # own guard: "Either 'declarative_access_group' or 'declarative_access_user'
    # must be set when pam_group is enabled." Verified on a live alma10 host,
    # 2026-08-24. The IIS example next door never had this bug -- it sets the
    # role's real variable directly.
    declarative_access_group: "{{ group_name }}"
    # Empty means a LOCAL principal with no @realm suffix, matching the role
    # default since ce863b1 in ansible-declarative-access. Named here anyway,
    # because since b5145ba this value is consumed by setfacl AND sudoers, not
    # just group.conf -- so a wrong realm no longer merely fails loudly. On an
    # AD-joined host with use_fully_qualified_names, a BARE group resolves to
    # nothing: setfacl dies with "Option -m: Invalid argument near character 7"
    # (its way of saying "unresolvable principal", naming a character offset
    # rather than the group), and sudo writes a %group rule that looks perfect
    # and grants nobody anything, silently. So on such a host pass the realm:
    #     -e ad_domain=corp.example
    declarative_access_ad_domain: "{{ ad_domain | default('') }}"
  vars_files:
    - "../../profiles/caddy/{{ distro_slug }}-access.yml"
  roles:
    - mcowser_p.declarative_access.declarative_access
